const wdOk=()=>S.done>=20&&vr()>=3&&S.joined;
function wd(){
  if(!wdOk()){
    const L=[[`Complete at least 20 tasks (${S.done}/20)`,S.done>=20],[`Have 3 valid referrals (${vr()}/3)`,vr()>=3],['Join the official channel',S.joined]];
    return opn(`${mh('Withdraw')}<p class="note">Complete all requirements to unlock withdrawals.</p>${L.map(([t,o])=>`<div class="ck ${o?'ok':''}"><i class="fa-${o?'solid fa-square-check':'regular fa-square'}"></i><span>${t}</span></div>`).join('')}`);
  }
  if(S.gram<MINW)return toast('Minimum withdrawal is '+MINW+' Gram');
  opn(`${mh('Withdraw')}<label>Gram address</label><input class="f" id="wa" placeholder="Enter your Gram address"><label>Memo (if any)</label><input class="f" id="wm" placeholder="Optional"><label>Amount (Gram)</label><input class="f" id="wam" type="number" step="0.001" inputmode="decimal" placeholder="Minimum ${MINW}"><p class="note">Available: ${S.gram.toFixed(3)} Gram. No withdrawal fee.</p><button class="btn" onclick="wdGo()">Withdraw</button>`);
}
function wdGo(){
  const a=$('#wa').value.trim(),n=+$('#wam').value;
  if(a.length<10)return toast('Enter a valid Gram address');
  if(!(n>=MINW))return toast('Minimum withdrawal is '+MINW+' Gram');
  if(n>S.gram)return toast('Not enough Gram balance');
  S.gram=+(S.gram-n).toFixed(3);tx('Withdraw','-'+n+' G');save();render();
  opn(`<div style="text-align:center;padding:10px 0"><i class="fa-solid fa-circle-check" style="font-size:42px;color:var(--ok)"></i><h3 style="margin:12px 0 6px">Successful</h3><p class="note">Your withdrawal will be completed within 3 hours at most.</p><button class="btn" onclick="cls()">Done</button></div>`);
}

[/^(\d+) left$/,['осталось $1','متبقي $1']],

[/^Version (.+)$/,['Версия $1','الإصدار $1']]
];
const ORIG=new WeakMap();
function trs(s){const i=LANG==='ru'?0:1,d=D[s];if(d)return d[i];for(const [re,t] of TP)if(re.test(s))return s.replace(re,t[i]);return null}
function tNode(n){
  if(LANG==='en')return;
  const v=n.nodeValue,s=v.trim();if(!s||!/[A-Za-z]/.test(s))return;
  const r=trs(s);if(r==null||r===s)return;
  ORIG.set(n,v);n.nodeValue=v.replace(s,()=>r);
}
const T=s=>LANG==='en'?s:(trs(s)||s);
function tAttr(e){
  if(!e.dataset.ph)e.dataset.ph=e.getAttribute('placeholder');
  e.setAttribute('placeholder',LANG==='en'?e.dataset.ph:(trs(e.dataset.ph)||e.dataset.ph));
}
function tTree(root){
  if(!root)return;
  if(root.nodeType===3){tNode(root);return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(ORIG.has(n)){n.nodeValue=ORIG.get(n);ORIG.delete(n)}if(LANG!=='en')tNode(n)}
  root.querySelectorAll('[placeholder]').forEach(tAttr);
  if(root.hasAttribute&&root.hasAttribute('placeholder'))tAttr(root);
}
const OB=new MutationObserver(ms=>{
  OB.disconnect();
  ms.forEach(m=>{
    if(m.type==='characterData')tNode(m.target);
    else if(m.type==='attributes'){if(m.target.dataset.ph!==m.target.getAttribute('placeholder')&&LANG!=='en')tAttr(m.target)}
    else m.addedNodes.forEach(tTree);
  });
  att();
});
function att(){OB.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder']})}
function setLang(l){
  LANG=l;try{localStorage.setItem('ag_lang',l)}catch(e){}
  const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
  OB.disconnect();tTree(document.body);att();
}
function pickL(k){PL=k;document.querySelectorAll('.lo').forEach(b=>b.classList.toggle('on',b.dataset.l===k))}
function saveL(){setLang(PL);cls()}
function langUI(){
  PL=LANG;
  opn(`${mh('Language')}<div class="lgl">${Object.keys(LN).map(k=>`<button class="lo ${k===LANG?'on':''}" data-l="${k}" onclick="pickL('${k}')"><span class="lf">${k.toUpperCase()}</span>${LN[k]}<i class="fa-solid fa-circle-check"></i></button>`).join('')}</div><p class="soon"><i class="fa-solid fa-hourglass-half"></i>More coming soon</p><button class="btn" onclick="saveL()">Save</button>`);
}
att();if(LANG!=='en')setLang(LANG);

go('home');cgo(0);
$('.sp-v').textContent='Version '+VER;
(function(){const MS=5200,t0=performance.now(),f=$('#lf'),pc=$('#lp');
const tick=n=>{const p=Math.min(1,(n-t0)/MS),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,v=Math.round(e*100);f.style.width=v+'%';pc.textContent=v+'%';if(p<1)requestAnimationFrame(tick);else setTimeout(()=>$('#splash').classList.add('out'),350)};
requestAnimationFrame(tick)})();
</script>
